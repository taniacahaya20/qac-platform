version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qac_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qac
      POSTGRES_PASSWORD: qac_pass
      POSTGRES_DB: qac_tester
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qac -d qac_tester"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: qac_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
